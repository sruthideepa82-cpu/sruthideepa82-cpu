<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Sruthi G</title>
  <desc id="heroDesc">Sruthi G. Computer Science Student, Creative Developer. Curiously wired to explore. Creatively wired to design. Logically wired to build.</desc>

  <rect width="1000" height="340" fill="#000000"/>

  <!-- ruler details -->
  <line x1="44" y1="24" x2="956" y2="24" stroke="#161616" stroke-width="1" stroke-dasharray="1 19"/>
  <line x1="44" y1="316" x2="956" y2="316" stroke="#161616" stroke-width="1" stroke-dasharray="1 19"/>

  <!-- top annotations -->
  <rect x="44" y="44" width="10" height="10" fill="#B6FF00"/>
  <text x="66" y="54" font-family="Menlo, Consolas, monospace" font-size="11" letter-spacing="2.5" fill="#4A4A4A">INDEX_01</text>
  <text x="956" y="54" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="11" letter-spacing="2.5" fill="#B6FF00">PORTFOLIO &#183; 2026</text>

  <!-- name -->
  <text x="44" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="100" font-weight="800" letter-spacing="-3" fill="#FFFFFF" textLength="430" lengthAdjust="spacingAndGlyphs">SRUTHI</text>
  <text x="486" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="100" font-weight="800" letter-spacing="-3" fill="none" stroke="#B6FF00" stroke-width="1.6" textLength="72" lengthAdjust="spacingAndGlyphs">G</text>

  <!-- accent bar + rule -->
  <rect x="44" y="208" width="6" height="30" fill="#B6FF00"/>
  <line x1="62" y1="224" x2="592" y2="224" stroke="#B6FF00" stroke-width="1.5"/>

  <!-- role -->
  <text x="62" y="266" font-family="Menlo, Consolas, monospace" font-size="19" letter-spacing="3.5" fill="#B6FF00">COMPUTER SCIENCE STUDENT</text>
  <text x="62" y="296" font-family="Menlo, Consolas, monospace" font-size="19" letter-spacing="3.5" fill="#B6FF00">CREATIVE DEVELOPER</text>

  <!-- column divider -->
  <line x1="628" y1="92" x2="628" y2="228" stroke="#B6FF00" stroke-width="1" opacity="0.5"/>

  <!-- tagline -->
  <text x="956" y="116" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="10" letter-spacing="3" fill="#3A3A3A">SIGNATURE</text>
  <text x="956" y="150" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="14" fill="#9A9A9A">Curiously wired to explore.</text>
  <text x="956" y="174" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="14" fill="#9A9A9A">Creatively wired to design.</text>
  <text x="956" y="198" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="14" fill="#9A9A9A">Logically wired to build.</text>

  <!-- dot grid accent -->
  <rect x="884" y="244" width="4" height="4" fill="#B6FF00"/>
  <rect x="894" y="244" width="4" height="4" fill="#232323"/>
  <rect x="904" y="244" width="4" height="4" fill="#232323"/>
  <rect x="884" y="254" width="4" height="4" fill="#232323"/>
  <rect x="894" y="254" width="4" height="4" fill="#232323"/>
  <rect x="904" y="254" width="4" height="4" fill="#232323"/>
  <rect x="884" y="264" width="4" height="4" fill="#232323"/>
  <rect x="894" y="264" width="4" height="4" fill="#232323"/>
  <rect x="904" y="264" width="4" height="4" fill="#232323"/>
</svg>